[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "perovskite-molecular-prioritization"
version = "1.0.0"
description = "Literature-guided molecular prioritization of organic spacer cations in layered perovskite photovoltaics."
requires-python = ">=3.13"
dependencies = [
  "numpy==2.4.6",
  "pandas==3.0.3",
  "scipy==1.18.0",
  "scikit-learn==1.9.0",
  "matplotlib==3.10.9",
  "rdkit==2026.3.5",
  "xgboost==3.4.1",
  "shap==0.49.1",
  "umap-learn==0.5.9.post2",
  "PyYAML==6.0.3",
  "Pillow==12.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
